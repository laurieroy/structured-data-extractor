[project]
name = "structured-data-extractor"
version = "0.1.0"
description = "Fault-tolerant LLM pipeline: messy PDFs/HTML → validated Pydantic v2 records, with reflection self-correction and a dead-letter queue."
readme = "README.md"
authors = [
    { name = "Laurie Roy", email = "laurieroy.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "instructor>=1.17.0",
    "json-repair>=0.64.2",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.uv]
package = false
